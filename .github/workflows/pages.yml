name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify calculations
        run: node --test tests/solver.test.cjs
      - name: Verify JavaScript syntax
        run: |
          node --check dist/solver.js
          node --check dist/app.js
          node --check dist/plot.js
      - name: Verify generated function plots
        run: python3 tools/generate_plots.py --check
      - name: Verify plot point rendering
        run: node --test tests/plot-markers.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          # The source PDF is intentionally not tracked or published.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
